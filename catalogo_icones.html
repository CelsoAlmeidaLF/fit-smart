<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Oficial de Ícones & Anatomia — Systekna FIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="src/apoio/stk-pkt-financ-icons.js"></script>
  <style>
    :root {
      --bg: #0E1210;
      --surface: #171D1A;
      --surface-2: #202824;
      --line: #2C3733;
      --accent: #6FCF97;
      --accent-soft: rgba(111, 207, 151, 0.12);
      --ink: #EAEFEA;
      --soft: #9BAEA4;
      --font-heading: 'Space Grotesk', -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-heading);
      padding: 24px;
      line-height: 1.5;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }
    .badge-pill {
      display: inline-block;
      padding: 4px 12px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 20px;
      font-family: var(--font-mono);
      font-size: 12px;
      margin-bottom: 8px;
    }
    h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    p.sub { color: var(--soft); font-size: 14px; }
    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--soft);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-heading);
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0E1210;
      border-color: var(--accent);
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    
    .grid-icons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card-icon {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .card-icon:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .icon-preview {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      border: 1px solid var(--line);
    }
    .icon-name {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      word-break: break-all;
    }
    .icon-category {
      font-size: 11px;
      color: var(--soft);
    }

    .grid-muscles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card-muscle {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-muscle img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #000;
      border-bottom: 1px solid var(--line);
    }
    .muscle-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .muscle-name { font-weight: 700; font-size: 15px; color: #fff; }
    .muscle-reg { font-size: 12px; color: var(--accent); font-family: var(--font-mono); }
    .muscle-path { font-size: 10px; color: var(--soft); font-family: var(--font-mono); word-break: break-all; margin-top: 4px; }
  </style>
</head>
<body>

    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('icons')">Ícones de UI (Lucide / SVG)</button>
